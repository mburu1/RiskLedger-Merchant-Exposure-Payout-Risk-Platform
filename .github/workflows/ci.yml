name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    name: Backend build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/RiskLedger.sln
      - run: dotnet build backend/RiskLedger.sln --configuration Release --no-restore
      - run: dotnet test backend/RiskLedger.sln --configuration Release --no-build
  frontend:
    name: Angular production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: frontend/riskledger-web
        run: npm install
      - name: Build
        working-directory: frontend/riskledger-web
        run: npm run build
